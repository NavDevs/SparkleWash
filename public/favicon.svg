<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="dropGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="50%" stop-color="#6EAAFF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#3B82F6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Water droplet body -->
  <path d="M32 6 C32 6, 14 28, 14 38 C14 48.5 22 56 32 56 C42 56 50 48.5 50 38 C50 28 32 6 32 6Z"
        fill="url(#dropGrad)" filter="url(#shadow)" stroke="#2563EB" stroke-width="1.5"/>

  <!-- Shine highlight on droplet -->
  <ellipse cx="24" cy="34" rx="6" ry="10" fill="url(#shineGrad)" transform="rotate(-15 24 34)"/>

  <!-- Sparkle star top-right -->
  <g transform="translate(48, 10)">
    <path d="M0 -6 L1.5 -1.5 L6 0 L1.5 1.5 L0 6 L-1.5 1.5 L-6 0 L-1.5 -1.5 Z"
          fill="#FBBF24" stroke="#F59E0B" stroke-width="0.5"/>
  </g>

  <!-- Sparkle star top-left (smaller) -->
  <g transform="translate(14, 14)">
    <path d="M0 -4 L1 -1 L4 0 L1 1 L0 4 L-1 1 L-4 0 L-1 -1 Z"
          fill="#FCD34D" stroke="#F59E0B" stroke-width="0.3"/>
  </g>

  <!-- Sparkle star right (tiny) -->
  <g transform="translate(52, 26)">
    <path d="M0 -3 L0.8 -0.8 L3 0 L0.8 0.8 L0 3 L-0.8 0.8 L-3 0 L-0.8 -0.8 Z"
          fill="#FDE68A" stroke="#FBBF24" stroke-width="0.3"/>
  </g>

  <!-- Small bubble circles -->
  <circle cx="38" cy="44" r="2.5" fill="none" stroke="#93C5FD" stroke-width="1" opacity="0.6"/>
  <circle cx="28" cy="48" r="1.5" fill="none" stroke="#93C5FD" stroke-width="0.8" opacity="0.5"/>
</svg>
